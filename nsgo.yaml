name: Remote Go
id: dev.remotego.app
version: 0.5.2

release:
  github: i5shuyi/remote-go
updates:
  channel: direct
  automatic: true
  key: Uq519xa4Yr2gx4E4PZ34BD2Yl22g1YsQ/M72398rmUY=
apple:
  info:
    NSAppleEventsUsageDescription: Remote Go 需要控制键盘鼠标以响应远程操作。
linux:
  categories: [Network, RemoteAccess]
  depends:
    # appsrc/appsink/videoconvert, ximagesrc and h264parse.
    deb: [gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad]
    arch: [gst-plugins-base, gst-plugins-good, gst-plugins-bad]
  recommends:
    # H.264 decoders and encoders, and Wayland screen sharing.
    deb: [gstreamer1.0-libav, gstreamer1.0-plugins-ugly, gstreamer1.0-vaapi, gstreamer1.0-pipewire, xdg-desktop-portal]
    arch: [gst-libav, gst-plugins-ugly, gst-plugin-pipewire, xdg-desktop-portal]
