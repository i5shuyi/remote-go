<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: absolute; inset: 0; }
  canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: auto; }
  #cursor { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; display: none; }
  #cursor svg { position: absolute; left: -2px; top: -1px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
  #hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #888;
    font: 14px -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="16" height="9"></canvas>
  <div id="cursor"><svg width="20" height="26" viewBox="0 0 20 26"><path d="M2 1 L2 20 L7 15.5 L10.5 23.5 L13.5 22.2 L10 14.5 L16.5 14.5 Z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
  <div id="hint">正在等待画面…</div>
</div>
<script>
// The remote screen of Remote Go's phone app. Go owns the connection (over
// tailcat) and posts each video frame here as a string; this page decodes
// H.264 with WebCodecs, which Android's WebView runs on MediaCodec, and
// turns touches into mouse events it posts back through window.nsgo.
(() => {
  // Android's bridge may exist but throw until the page has fully started.
  const post = o => { try { window.nsgo && window.nsgo.postMessage(JSON.stringify(o)); } catch (e) { } };
  let got = 0;
  window.addEventListener('error', e => post({ t: 'log', msg: 'error: ' + e.message }));
  let hellos = 0;
  const debug = false; // true shows the player's state while it waits
  setInterval(() => {
    const msg = 'bridge ' + (window.nsgo ? 'yes' : 'no') + ', hellos ' + hellos + ', got ' + got + ', canvas ' + cv.width + 'x' + cv.height + ', decoder ' + (dec ? dec.state + ' q' + dec.decodeQueueSize : 'none') + ', frames ' + frames;
    if (got === 0) { hellos++; post({ t: 'ready', h264: hasDecoder }); }
    if (debug) post({ t: 'log', msg });
    if (debug && hint.style.display !== 'none') hint.textContent = '正在等待画面… ' + msg;
  }, 1000);
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const cursorEl = document.getElementById('cursor'), hint = document.getElementById('hint');

  // ---------------------------------------------------------------- video
  let dec = null, decCodec = '', needKey = true, ts = 0, frames = 0, failed = false;
  const hasDecoder = 'VideoDecoder' in window;

  function codecFromSPS(d) {
    for (let i = 0; i + 6 < d.length; i++) {
      if (d[i] === 0 && d[i + 1] === 0 && d[i + 2] === 1 && (d[i + 3] & 0x1f) === 7) {
        const h = x => x.toString(16).padStart(2, '0');
        return 'avc1.' + h(d[i + 4]) + h(d[i + 5]) + h(d[i + 6]);
      }
    }
    return 'avc1.640034';
  }
  function b64(s) {
    if (Uint8Array.fromBase64) return Uint8Array.fromBase64(s);
    const bin = atob(s), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function draw(img) {
    const w = img.displayWidth || img.width, h = img.displayHeight || img.height;
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; layout(); }
    ctx.drawImage(img, 0, 0);
    if (hint.style.display !== 'none') hint.style.display = 'none';
    frames++;
  }
  function closeDecoder() {
    if (dec && dec.state !== 'closed') try { dec.close(); } catch (e) { }
    dec = null; needKey = true;
  }
  function resync() { closeDecoder(); post({ t: 'kf' }); }
  function onH264(key, data) {
    if (!hasDecoder) {
      if (!failed) { failed = true; post({ t: 'error', msg: '此设备的 WebView 不支持 WebCodecs 硬件解码，请更新 Android System WebView' }); }
      return;
    }
    if (key) {
      const c = codecFromSPS(data);
      if (!dec || dec.state === 'closed' || c !== decCodec) {
        closeDecoder();
        dec = new VideoDecoder({ output: f => { draw(f); f.close(); }, error: e => { post({ t: 'log', msg: 'decoder error: ' + e }); resync(); } });
        dec.configure({ codec: c, optimizeForLatency: true, hardwareAcceleration: 'prefer-hardware' });
        decCodec = c;
      }
      needKey = false;
    }
    if (needKey || !dec) return;
    if (dec.decodeQueueSize > 8) { resync(); return; }
    dec.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: (ts += 16666), data }));
  }
  async function onJPEG(data) {
    const bmp = await createImageBitmap(new Blob([data], { type: 'image/jpeg' }));
    draw(bmp); bmp.close();
  }
  setInterval(() => { post({ t: 'fps', n: frames }); frames = 0; }, 1000);

  // Messages from Go: "k"/"d" + base64 H.264 key/delta frame, "j" + base64
  // JPEG, "v" a new video stream, "m" + mode, "z" reset the zoom.
  window.addEventListener('message', ev => {
    const s = ev.data;
    got++;
    if (typeof s !== 'string' || !s) { post({ t: 'log', msg: 'non-string message ' + typeof s }); return; }
    switch (s[0]) {
      case 'k': onH264(true, b64(s.slice(1))); break;
      case 'd': onH264(false, b64(s.slice(1))); break;
      case 'j': onJPEG(b64(s.slice(1))); break;
      case 'v': closeDecoder(); break;
      case 'm': setMode(s.slice(1)); break;
      case 'z': view.z = 1; layout(); break;
    }
  });

  // ---------------------------------------------------------------- view
  // The screen fits the page (contain); a pinch zooms it from 1× to 5×.
  const view = { z: 1, px: 0, py: 0 };
  function fit() { return Math.min(innerWidth / cv.width, innerHeight / cv.height); }
  function size() { const s = fit() * view.z; return { w: cv.width * s, h: cv.height * s, s }; }
  function clampPan() {
    const { w, h } = size();
    view.px = w <= innerWidth ? (innerWidth - w) / 2 : Math.min(0, Math.max(innerWidth - w, view.px));
    view.py = h <= innerHeight ? (innerHeight - h) / 2 : Math.min(0, Math.max(innerHeight - h, view.py));
  }
  function layout() {
    clampPan();
    cv.style.transform = `translate(${view.px}px, ${view.py}px) scale(${size().s})`;
    placeCursor();
  }
  addEventListener('resize', layout);
  // Page point → screen fraction (0..1), clamped.
  function norm(x, y) {
    const { w, h } = size();
    return { x: Math.min(1, Math.max(0, (x - view.px) / w)), y: Math.min(1, Math.max(0, (y - view.py) / h)) };
  }
  function zoomAt(cx, cy, factor) {
    const before = norm(cx, cy);
    view.z = Math.min(5, Math.max(1, view.z * factor));
    const { w, h } = size();
    view.px = cx - before.x * w; view.py = cy - before.y * h;
    layout();
  }

  // ---------------------------------------------------------------- input
  // Two modes, as UU Remote's: "touch" clicks where the finger is; "pad"
  // drives a cursor like a laptop's touchpad.
  let mode = 'touch';
  const cur = { x: 0.5, y: 0.5 };
  function setMode(m) { mode = m === 'pad' ? 'pad' : 'touch'; cursorEl.style.display = mode === 'pad' ? 'block' : 'none'; placeCursor(); }
  function placeCursor() {
    if (mode !== 'pad') return;
    const { w, h } = size();
    cursorEl.style.transform = `translate(${view.px + cur.x * w}px, ${view.py + cur.y * h}px)`;
  }
  const move = p => post({ t: 'mm', x: p.x, y: p.y });
  const click = (p, b) => { post({ t: 'mm', x: p.x, y: p.y }); post({ t: 'md', b, x: p.x, y: p.y }); post({ t: 'mu', b, x: p.x, y: p.y }); };

  const pts = new Map();     // active pointers: id → {x, y, sx, sy}
  let g = null;              // the current gesture
  let lastTapUp = 0;         // for the touchpad's tap-then-drag
  const SLOP = 8, LONG = 500;

  function centroid() {
    let x = 0, y = 0;
    pts.forEach(p => { x += p.x; y += p.y; });
    return { x: x / pts.size, y: y / pts.size };
  }
  function spread() {
    const a = [...pts.values()];
    return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
  }

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('pointerdown', e => {
    e.preventDefault();
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
    if (pts.size === 1) {
      const now = performance.now();
      g = { kind: 'one', t0: now, moved: false, dragging: false, long: null, last: { x: e.clientX, y: e.clientY } };
      if (mode === 'touch') {
        g.long = setTimeout(() => { if (g && g.kind === 'one' && !g.moved) { g.done = true; click(norm(g.last.x, g.last.y), 2); } }, LONG);
      } else if (now - lastTapUp < 300) {
        g.dragging = true; // tap, then touch and drag: hold the button
        post({ t: 'md', b: 0, x: cur.x, y: cur.y });
      }
    } else if (pts.size === 2) {
      if (g && g.long) clearTimeout(g.long);
      if (g && g.dragging) post({ t: 'mu', b: 0, ...(mode === 'pad' ? cur : norm(g.last.x, g.last.y)) });
      const c = centroid();
      g = { kind: 'two', t0: performance.now(), moved: false, sub: '', c, d: spread() };
    }
  }, { passive: false });

  document.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId);
    if (!p || !g) return;
    e.preventDefault();
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (g.kind === 'one') {
      if (!g.moved && Math.hypot(p.x - p.sx, p.y - p.sy) > SLOP) {
        g.moved = true;
        if (g.long) clearTimeout(g.long);
        if (mode === 'touch' && !g.done) {
          // Drag: press where the finger went down, then follow it.
          const s = norm(p.sx, p.sy);
          move(s); post({ t: 'md', b: 0, x: s.x, y: s.y });
          g.dragging = true;
        }
      }
      if (!g.moved) return;
      g.last = { x: p.x, y: p.y };
      if (mode === 'touch') { if (g.dragging) move(norm(p.x, p.y)); return; }
      const { w, h } = size(), speed = 1.6;
      cur.x = Math.min(1, Math.max(0, cur.x + dx * speed / w));
      cur.y = Math.min(1, Math.max(0, cur.y + dy * speed / h));
      placeCursor(); move(cur);
    } else if (g.kind === 'two' && pts.size === 2) {
      const c = centroid(), d = spread();
      if (!g.sub) {
        const zoom = Math.abs(d - g.d) > 24, pan = Math.hypot(c.x - g.c.x, c.y - g.c.y) > SLOP;
        if (zoom) g.sub = 'zoom'; else if (pan) g.sub = 'scroll';
        if (!g.sub) return;
        g.moved = true;
      }
      if (g.sub === 'zoom') {
        zoomAt(c.x, c.y, d / g.d);
        view.px += c.x - g.c.x; view.py += c.y - g.c.y; layout();
      } else {
        post({ t: 'wh', dx: -(c.x - g.c.x) * 2, dy: -(c.y - g.c.y) * 2 });
      }
      g.c = c; g.d = d;
    }
  }, { passive: false });

  function up(e) {
    const p = pts.get(e.pointerId);
    if (!p) return;
    pts.delete(e.pointerId);
    if (!g) return;
    const now = performance.now();
    if (g.kind === 'one') {
      if (g.long) clearTimeout(g.long);
      if (g.dragging) {
        post({ t: 'mu', b: 0, ...(mode === 'pad' ? cur : norm(p.x, p.y)) });
      } else if (!g.moved && !g.done && now - g.t0 < LONG) {
        click(mode === 'pad' ? cur : norm(p.x, p.y), 0);
        lastTapUp = now;
      }
      g = null;
    } else if (g.kind === 'two') {
      if (pts.size === 0) {
        if (!g.moved && now - g.t0 < 300) click(mode === 'pad' ? cur : norm(g.c.x, g.c.y), 2); // two-finger tap
        g = null;
      }
    }
  }
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
  layout();
  // Android injects window.nsgo only once the page has started, maybe
  // after this script ran: say ready until Go answers with a message.
  const hello = () => { if (got === 0) { hellos++; post({ t: 'ready', h264: hasDecoder }); setTimeout(hello, 300); } };
  hello();
})();
</script>
</body>
</html>
